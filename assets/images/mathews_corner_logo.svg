<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C7" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="65%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
  </defs>

  <!-- Outer double ring border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7" />

  <!-- Bold serif M — large, centered, dominant -->
  <!-- Left outer stem -->
  <rect x="38" y="58" width="12" height="82" fill="url(#goldGrad2)" rx="1"/>
  <!-- Left inner diagonal going down-right to center -->
  <polygon points="50,58 62,58 100,118 88,118" fill="url(#goldGrad2)"/>
  <!-- Right inner diagonal going down-left to center -->
  <polygon points="150,58 138,58 100,118 112,118" fill="url(#goldGrad2)"/>
  <!-- Right outer stem -->
  <rect x="150" y="58" width="12" height="82" fill="url(#goldGrad2)" rx="1"/>
  <!-- Bottom serifs -->
  <rect x="33" y="136" width="22" height="5" fill="url(#goldGrad2)" rx="1"/>
  <rect x="145" y="136" width="22" height="5" fill="url(#goldGrad2)" rx="1"/>
  <!-- Top serifs -->
  <rect x="33" y="57" width="22" height="5" fill="url(#goldGrad2)" rx="1"/>
  <rect x="145" y="57" width="22" height="5" fill="url(#goldGrad2)" rx="1"/>

  <!-- Laurel / leaf sprig growing from right of M, upward -->
  <!-- Main stem arching up -->
  <path d="M 148,135 Q 160,100 152,52" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Leaves on right side of stem (outward) -->
  <path d="M 155,120 C 167,114 175,120 172,130 C 163,132 157,127 155,120 Z" fill="url(#goldGrad)"/>
  <path d="M 158,102 C 170,95 178,101 175,111 C 166,113 160,109 158,102 Z" fill="url(#goldGrad)"/>
  <path d="M 159,83 C 170,75 177,82 174,92 C 165,93 160,89 159,83 Z" fill="url(#goldGrad)"/>
  <path d="M 156,65 C 165,56 172,62 169,72 C 162,73 157,70 156,65 Z" fill="url(#goldGrad)"/>
  <path d="M 152,52 C 158,42 165,46 162,54 C 157,56 153,55 152,52 Z" fill="url(#goldGrad)"/>

  <!-- Leaves on left side of stem (inward) -->
  <path d="M 150,112 C 141,107 138,98 144,93 C 149,97 151,105 150,112 Z" fill="url(#goldGrad)"/>
  <path d="M 154,93 C 145,87 143,79 149,74 C 154,78 155,86 154,93 Z" fill="url(#goldGrad)"/>
  <path d="M 154,74 C 146,69 145,61 151,57 C 155,61 156,68 154,74 Z" fill="url(#goldGrad)"/>

  <!-- Small berry/dot at tip -->
  <circle cx="152" cy="50" r="3" fill="url(#goldGrad)"/>
</svg>
